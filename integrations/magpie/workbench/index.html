<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语言资源维护</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
<h1>语言资源维护</h1>
<p id="mode">正在读取应用信息…</p>
<section id="paths" aria-label="检测到的位置"></section>
<section>
<h2>语言</h2>
<label for="locale-select">本次操作的语言</label>
<select id="locale-select" disabled>
<option value="zh-Hans">简体中文</option>
<option value="zh-Hant">繁體中文</option>
</select>
<p class="note">选择语言后，执行下方操作。</p>
</section>
<section>
<h2>操作</h2>
<div class="actions">
<button type="button" data-action="check" data-mode="original" data-win="true" disabled>检查兼容性</button>
<button type="button" data-action="install" data-mode="original" data-win="true" data-write="true" disabled>写入语言资源</button>
<button type="button" data-action="detect" disabled>检查网关</button>
<button type="button" data-action="status" disabled>查看状态</button>
<button type="button" data-action="plan" disabled>查看计划</button>
<button type="button" data-action="import-cache" data-write="true" disabled>导入语言缓存</button>
<button type="button" data-action="prepare" data-mode="copy" data-write="true" disabled>创建独立测试副本</button>
<button type="button" data-action="switch" data-win="true" data-write="true" disabled>切换语言</button>
<button type="button" data-action="launch" data-mode="copy" disabled>启动独立测试副本</button>
<button type="button" data-action="restore" data-win="true" data-write="true" disabled>恢复原始语言文件</button>
<button type="button" data-action="mac-apply" data-mac="true" data-write="true" disabled>立即加载中文</button>
<button type="button" data-action="mac-restore" data-mac="true" data-write="true" disabled>撤销中文注入</button>
</div>
<p id="guard" class="note"></p>
</section>
<section>
<h2>结果</h2>
<pre id="log" role="status">还没有操作。</pre>
</section>
</main>
<script src="/app.js"></script>
</body>
</html>
