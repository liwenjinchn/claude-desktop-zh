<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Claude 中文</title><link rel="stylesheet" href="style.css"><script src="_magpie/bridge.js"></script><script src="app.js" defer></script></head>
<body><main><h1>Claude 第三方模式中文</h1><p>选择语言并保存到 magpie。应用汉化需要运行独立工具，本页不会修改 Claude 文件。</p>
<fieldset><legend>语言</legend><label><input type="radio" name="locale" value="zh-Hans" checked>简体中文</label><label><input type="radio" name="locale" value="zh-Hant">繁體中文</label></fieldset>
<button id="save" type="button">保存语言偏好</button><p id="status" role="status"></p>
<h2>检查和切换</h2><p>宿主扩展提供 claude_zh_manage 工具。先按项目文档配置路径；写操作默认关闭。纯页面不能直接调用宿主工具。也可关闭副本后在项目目录运行：</p><pre id="command"></pre>
<p>只有同时启用 allowWrites 和 autoSync，并预先创建受管副本时，宿主才会定期检查真实的 3p Gateway 配置并同步选定语言。运行中的副本不会被修改。宿主退出后监控停止，不会替换商店版启动入口。</p></main></body></html>
