<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Claude 中文</title><link rel="icon" href="icon.png"><link rel="stylesheet" href="style.css"><script src="_magpie/bridge.js"></script><script src="app.js?v=settings-5" defer></script></head>
<body><main>
<div class="plugin-heading"><img src="icon.png" width="64" height="64" alt=""><div><h1>Claude 中文</h1><span>claude-desktop-zh</span></div></div>
<p>为第三方模式加载官方中文界面，继续使用原来的设置和会话。</p>
<fieldset><legend>语言</legend><label><input type="radio" name="locale" value="zh-Hans" checked>简体中文</label><label><input type="radio" name="locale" value="zh-Hant">繁體中文</label></fieldset>
<label><input id="runtime-auto" type="checkbox" checked>启动时加载中文</label>
<button id="save" type="button">保存设置</button><p id="status" role="status" aria-live="polite"></p>
<h2>首次使用</h2>
<ol><li>Claude 已打开时，通过「文件 → 退出」正常退出。</li><li>看到「中文已准备好」通知后，从原入口打开 Claude。</li></ol>
<p>使用时保持 magpie 运行。加载时可能短暂出现调试窗口和文件选择框，完成后自动收起。</p>
<h2>如何加载</h2><p>每次 Claude 启动后，插件通过本地脚本将官方中文语言文件加载到当前窗口内存，并切换语言。首次准备会备份应用设置。</p>
</main></body></html>
